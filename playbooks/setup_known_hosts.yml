---
- name: Ajouter les clés SSH publiques au fichier known_hosts
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ajouter la clé ed25519 de chaque node géré
      ansible.builtin.known_hosts:
        name: "{{ hostvars[item].ansible_host }}"
        key: "{{ lookup('ansible.builtin.pipe', 'ssh-keyscan -t ed25519 ' + hostvars[item].ansible_host) }}"
        path: "{{ lookup('ansible.builtin.env', 'HOME') + '/.ssh/known_hosts' }}"
        hash_host: true
        state: present
      loop: "{{ groups['all'] }}"