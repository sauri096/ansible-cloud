---
 - name: Verifer et installer Python3 sur les nodes
   hosts: all
   gather_facts: false
   become: true
   tasks:
     - name: Verifier si Python3 est installé
       ansible.builtin.command: which python3
       register: python_install_check
       ignore_errors: true
       changed_when: false
     - name: Installer Python3 si non present
       ansible.builtin.raw: apt update && apt install -y python3
       when: python_install_check.rc != 0
       